[ErisPulse.framework]
enable_lazy_loading = true
handler_max_concurrency = 64
offline_bot_expiry = 3600
proactive_gc_interval = 300
strict_mode = 0
uninit_timeout = 30

[ErisPulse.i18n]
language = "auto"

[ErisPulse.logger]
format = "rich"
level = "INFO"
log_files = []
memory_limit = 1000

[ErisPulse.modules]

[ErisPulse.server]
host = "0.0.0.0"
port = 8000

[ErisPulse.storage]
use_global_db = false

[ErisPulse.adapters.status]
yunhu = true

[ErisPulse.event.command]
allow_space_prefix = false
case_sensitive = true
must_at_bot = false
prefix = "/"

[ErisPulse.event.message]
ignore_self = true

[ErisPulse.framework.strict_mode_exceptions]
adapters = []
modules = []

[ErisPulse.master.users]

[Yunhu_Adapter.accounts.default]
bot_id = ""
enabled = true
mode = "ws"
token = "asdasdadwasdawdasdawdasdawdaffasfs"
webhook_path = "/webhook"

[ErisPulse.router.security.headers]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
